<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabitha Wambui</title>
    <link rel="stylesheet" href="style.css">
   <h1>Tabitha Playground</h1>
    <!-- Event Handling -->
  <button id="clickBtn">Contact</button>
  <div id="hoverBox">CONTACT ME</div>
  <input type="text" id="keyInput" placeholder="Type something...">
  <button id="secretBtn">Double-Click or Long Press Me</button>
  
  <!-- Interactive Elements -->
  <button id="colorBtn">Change My Color!</button>

  <div class="tabs">
    <button class="tab" data-tab="1">Tab 1</button>
    <button class="tab" data-tab="2">Tab 2</button>
    <div class="tab-content" id="tab-1">Content for Tab 1</div>
    <div class="tab-content" id="tab-2">Content for Tab 2</div>
  </div>

  <!-- Form Validation -->
  <form id="sampleForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <span id="passwordFeedback"></span>
    <button type="submit">Submit</button>
  </form>
  <script src="script.js"></script>


</head>
